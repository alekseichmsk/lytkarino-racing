<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.json">
<title>Лыткарино Гонки</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;}canvas#gl{position:fixed;inset:0;width:100vw!important;height:100vh!important;height:100dvh!important;display:block}#fs{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:5;width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);color:#fff;font-size:22px}body{font-family:sans-serif;touch-action:none}
#info{position:fixed;left:10px;top:8px;color:#fff;font-size:13px;text-shadow:0 0 4px #000}
#tc{display:none;user-select:none;-webkit-user-select:none;touch-action:none}#tc.on{display:block}body.tch #info{font-size:10px;max-width:60vw}
#sw{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:10px;width:min(150px,38vh);height:min(150px,38vh);opacity:.6;touch-action:none}
#sw svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 4px #000)}
.pd{position:fixed;touch-action:none;border-radius:10px;background:linear-gradient(#5a5a5a,#1d1d1d);border:2px solid rgba(255,255,255,.45);opacity:.65;box-shadow:0 3px 6px #000}
.pd::after{content:"";position:absolute;left:12%;right:12%;top:10%;bottom:10%;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 3px,transparent 3px 9px);border-radius:6px}
.pd i{position:absolute;left:0;right:0;bottom:0;background:rgba(255,160,60,.45);border-radius:0 0 8px 8px;height:0}
#gasP{right:calc(14px + env(safe-area-inset-right));bottom:12px;width:min(58px,15vh);height:min(140px,36vh)}
#brkP{right:calc(84px + env(safe-area-inset-right));bottom:12px;width:min(96px,25vh);height:min(72px,19vh)}
#gsel{position:fixed;right:calc(24px + env(safe-area-inset-right));bottom:calc(min(140px,36vh) + 22px);display:flex;flex-direction:column;gap:3px;opacity:.75}
#gsel b{width:38px;height:min(30px,8vh);display:flex;align-items:center;justify-content:center;border-radius:6px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.4);color:#ccc;font:bold 16px sans-serif}
#gsel b.a{background:#2f86ff;color:#fff;border-color:#9cf}
#hb{position:fixed;right:calc(84px + env(safe-area-inset-right));bottom:calc(min(72px,19vh) + 22px);width:56px;height:34px;border-radius:8px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.45);color:#fff;font:bold 14px sans-serif;display:flex;align-items:center;justify-content:center;opacity:.75;touch-action:none}


</style></head><body>
<button id="fs" title="Полный экран">⛶</button><div id="info">Лыткарино • Вид из салона • WASD/стрелки, Space — ручник, P/R/N, E или Shift+D — Drive, Backspace — сброс • © OpenStreetMap • Imagery © Esri</div>
<div id="tc"><div id="sw"><svg viewBox="-100 -100 200 200"><g id="swg"><circle r="88" fill="none" stroke="#222" stroke-width="20"/><circle r="88" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="6 5"/><rect x="-6" y="-100" width="12" height="16" fill="#e33"/><path d="M-78,-6 L-30,-14 L30,-14 L78,-6 L78,10 L30,8 L14,70 L-14,70 L-30,8 L-78,10Z" fill="#2a2a2a" stroke="#888" stroke-width="2"/><rect x="-28" y="-20" width="56" height="40" rx="10" fill="#151515" stroke="#aaa" stroke-width="2"/><circle r="11" fill="none" stroke="#ccc" stroke-width="3"/></g></svg></div>
<div class="pd" id="brkP"><i></i></div><div class="pd" id="gasP"><i></i></div><div id="gsel"><b data-g="P">P</b><b data-g="R">R</b><b data-g="N">N</b><b data-g="D">D</b></div><div id="hb">HB</div></div>
<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script src="data.js"></script><script src="sat.js"></script><script src="game.js"></script></body></html>
