html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;}canvas#gl{position:fixed;inset:0;width:100vw!important;height:100vh!important;height:100dvh!important;display:block}#ui{position:fixed;top:calc(6px + env(safe-area-inset-top));right:calc(6px + env(safe-area-inset-right));z-index:5;display:flex;gap:4px;opacity:.6}#ui b{width:30px;height:30px;border-radius:8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);color:#fff;font:15px sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;touch-action:none}#pop{position:fixed;top:calc(42px + env(safe-area-inset-top));right:calc(6px + env(safe-area-inset-right));z-index:6;display:none;grid-template-columns:repeat(4,30px);gap:4px;opacity:.75}#pop.on{display:grid}#pop b{width:30px;height:28px;border-radius:7px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);color:#fff;font:12px sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}#ui b.a{background:rgba(255,190,60,.55)}body{font-family:sans-serif;touch-action:none}
#info{transition:opacity 1s;position:fixed;left:10px;top:8px;color:#fff;font-size:13px;text-shadow:0 0 4px #000}
#tc{display:none;user-select:none;-webkit-user-select:none;touch-action:none}#tc.on{display:block}body.tch #info{transition:opacity 1s;font-size:10px;max-width:60vw}

#sw svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 4px #000)}
.pd{position:fixed;touch-action:none;border-radius:10px;background:linear-gradient(#5a5a5a,#1d1d1d);border:2px solid rgba(255,255,255,.45);opacity:.65;box-shadow:0 3px 6px #000}
.pd::after{content:"";position:absolute;left:12%;right:12%;top:10%;bottom:10%;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 3px,transparent 3px 9px);border-radius:6px}
.pd i{position:absolute;left:0;right:0;bottom:0;background:rgba(255,160,60,.45);border-radius:0 0 8px 8px;height:0}
#gasP{right:calc(14px + env(safe-area-inset-right));bottom:12px;width:min(58px,15vh);height:min(140px,36vh)}
#brkP{right:calc(84px + env(safe-area-inset-right));bottom:12px;width:min(96px,25vh);height:min(72px,19vh)}

#lever{position:fixed;right:calc(80px + env(safe-area-inset-right));bottom:calc(min(72px,19vh) + 62px);width:40px;height:min(86px,22vh);touch-action:none;opacity:.7}#lever svg{width:100%;height:100%;overflow:visible}#hb{position:fixed;right:calc(84px + env(safe-area-inset-right));bottom:calc(min(72px,19vh) + 22px);width:56px;height:34px;border-radius:8px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.45);color:#fff;font:bold 14px sans-serif;display:flex;align-items:center;justify-content:center;opacity:.75;touch-action:none}
