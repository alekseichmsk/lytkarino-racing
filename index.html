<title>Лыткарино Гонки</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;}canvas#gl{position:fixed;inset:0;width:100vw!important;height:100vh!important;height:100dvh!important;display:block}#fs{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:5;width:44px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35);color:#fff;font-size:22px}body{font-family:sans-serif;touch-action:none}

.t{position:fixed;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:30px;display:none;align-items:center;justify-content:center;user-select:none}
